<!doctype html>
<!-- The pre-CSS ground lives on <html>, not <body>, and that placement is
     load-bearing. The root element's background is propagated to the canvas and
     painted before everything, including negative-z-index layers. A background
     on <body> is an ordinary in-flow block background instead, which in CSS
     painting order comes AFTER negative-z-index stacking contexts — so it
     covered BoardBackground (fixed, -z-10) completely and the board rendered as
     plain black with every layer present and correctly sized. -->
<html lang="en" style="background:#0E0F11">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Fonts are self-hosted (src/fonts.css → public/fonts) rather than loaded
         from Google, so no visitor IP reaches a third party before consent. -->
    <link rel="preload" href="/fonts/hanken-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>Custom PC Builder — Build & Price Your Gaming PC in 3D</title>
    <meta name="description" content="Plan a compatible custom gaming PC in 3D: auto-build to your budget, check real-game FPS, spot bottlenecks, and share your build." />
    <meta name="theme-color" content="#0E0F11" />
    <meta name="google-site-verification" content="4l1jmNOPVTE9FrguZxnUVmpXPi2YM-lS7g0w_8a_3c4" />
    <link rel="canonical" href="https://custompcbuilder.netlify.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Custom PC Builder" />
    <meta property="og:title" content="Custom PC Builder — Build & Price Your Gaming PC in 3D" />
    <meta property="og:description" content="Plan a compatible custom gaming PC in 3D: auto-build to your budget, check real-game FPS, spot bottlenecks, and share your build." />
    <meta property="og:url" content="https://custompcbuilder.netlify.app/" />
    <meta property="og:image" content="https://custompcbuilder.netlify.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Custom PC Builder — Build & Price Your Gaming PC in 3D" />
    <meta name="twitter:description" content="Plan a compatible custom gaming PC in 3D: auto-build to your budget, check real-game FPS, spot bottlenecks, and share your build." />
    <meta name="twitter:image" content="https://custompcbuilder.netlify.app/og-image.png" />
  </head>

    <script type="module" src="/src/main.jsx"></script>

</html>
